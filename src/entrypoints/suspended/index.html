<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suspended Tab</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0f172a;
        color: #94a3b8;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        cursor: pointer;
        user-select: none;
      }
      .card {
        padding: 24px 32px;
        background-color: #1e293b;
        border-radius: 12px;
        border: 1px solid #334155;
        text-align: center;
        max-width: 420px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: #3b82f6;
      }
      .title {
        color: #f8fafc;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hint {
        font-size: 13px;
        color: #64748b;
      }
      .shortcut {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        background: #0f172a;
        color: #38bdf8;
        font-size: 12px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="tab-title" class="title">Loading...</div>
      <div class="hint">Tab suspended to save memory</div>
      <div class="shortcut">Click anywhere to load</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
